<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>起始页</title>
  <link rel="stylesheet" href="style.css?v=16">
</head>
<body>
  <!-- ===== Background ===== -->
  <div class="bg-layer" id="bgLayer"><img class="bg-img" id="bgImg" alt="" decoding="async" fetchpriority="high"></div>
  <div class="bg-overlay" id="bgOverlay"></div>

  <!-- ===== Top Bar ===== -->
  <div class="top-bar" id="topBar">
    <div class="top-bar-left">
      <div class="weather-widget" id="weatherWidget" title="点击查看天气详情" role="button" tabindex="0" aria-label="天气信息">
        <span class="w-icon" id="weatherIconWrap" aria-hidden="true">
          <!-- 默认太阳图标，加载后会被替换 -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--icon-weather-sun)"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/></svg>
        </span>
        <span id="weatherText" aria-live="polite">加载中</span>
      </div>
    </div>
    <div class="top-bar-right">
      <!-- 便笺按钮 - 琥珀色 -->
      <button class="icon-btn" id="notesBtn" title="便笺" aria-label="打开便笺">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
      </button>
      <!-- 深色模式按钮 - 橙黄色 -->
      <button class="icon-btn" id="themeBtn" title="深色模式" aria-label="切换深色模式" aria-pressed="false">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <!-- 设置按钮 - 紫色 -->
      <button class="icon-btn" id="settingsBtn" title="设置" aria-label="打开设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <!-- 关于按钮 - 青柠色 -->
      <button class="icon-btn" id="aboutBtn" title="关于" aria-label="关于本页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      </button>
    </div>
  </div>

  <!-- ===== Main Content ===== -->
  <div class="main-content" id="mainContent">
    <div class="time-section">
      <div class="time-greeting" id="greeting">下午好</div>
      <div class="time-display" id="timeDisplay">00:00</div>
      <div class="date-display" id="dateDisplay"></div>
    </div>

    <div class="search-container">
      <div class="search-box" id="searchBox">
        <!-- 搜索图标 - 蓝色 -->
        <div class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </div>
        <input class="search-input" id="searchInput" type="text" placeholder="搜索或输入网址" autocomplete="off" autofocus aria-label="搜索框">
        <div class="search-engine-selector" id="engineSelector" role="button" tabindex="0" aria-label="选择搜索引擎" aria-haspopup="listbox">
          <span class="engine-mini-icon" id="currentEngineIconWrap" aria-hidden="true"></span>
          <span id="currentEngineName">百度</span>
          <!-- 下拉箭头 - 灰蓝色 -->
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
      <div class="engine-dropdown" id="engineDropdown" role="listbox" aria-label="搜索引擎列表"></div>
      <div class="quick-actions">
        <!-- 翻译 - 蓝色 -->
        <div class="quick-action-btn" data-action="translate" role="button" tabindex="0" aria-label="翻译">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8l6 6M4 14l6-6 2-3M2 5h12M7 2h1M22 22l-5-10-5 10M14 18h6"/></svg>
          <span>翻译</span>
        </div>
        <!-- 计算 - 橙色 -->
        <div class="quick-action-btn" id="calcBtn" data-action="calc" role="button" tabindex="0" aria-label="计算器" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="12" y2="14"/><line x1="8" y1="18" x2="12" y2="18"/><line x1="16" y1="14" x2="16" y2="18"/></svg>
          <span>计算</span>
        </div>
        <!-- 导航 - 青色 -->
        <div class="quick-action-btn" data-action="sites" role="button" tabindex="0" aria-label="快捷导航">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
          <span>导航</span>
        </div>
      </div>
    </div>
  </div><!-- /main-content -->

  <!-- ===== Hitokoto（一言） ===== -->
  <div class="hitokoto-section" id="hitokotoSection">
    <div class="hitokoto-text" id="hitokotoText">正在加载...</div>
    <div class="hitokoto-source" id="hitokotoSource"></div>
  </div>

  <!-- ===== Shortcuts Panel（快捷导航面板） ===== -->
  <div class="shortcuts-panel" id="shortcutsPanel" role="dialog" aria-modal="true" aria-label="快捷导航">
    <div class="bg-dimmer"></div>
    <div class="shortcuts-header">
      <div class="shortcuts-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--icon-sites);width:20px;height:20px" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
        快捷导航
      </div>
      <!-- 关闭按钮 - 红色 -->
      <button class="icon-btn" id="closeShortcuts" title="关闭" aria-label="关闭快捷导航">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--icon-close);width:20px;height:20px" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="shortcuts-grid" id="shortcutsGrid"></div>
  </div>

  <!-- ===== Weather Detail Panel（天气详情浮层） ===== -->
  <div class="weather-detail-panel" id="weatherDetailPanel" role="dialog" aria-modal="true" aria-label="天气详情">
    <div class="bg-dimmer"></div>
    <div class="weather-detail-card">
      <div class="weather-detail-header">
        <div class="wd-city" id="wdCity">--</div>
        <button class="icon-btn wd-close" id="wdClose" title="关闭" aria-label="关闭天气详情"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--icon-close);width:20px;height:20px" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="weather-detail-body">
        <div class="wd-main">
          <span class="wd-icon" id="wdIcon" aria-hidden="true"></span>
          <div class="wd-temp" id="wdTemp" aria-live="polite">--</div>
          <div class="wd-desc" id="wdDesc">加载中</div>
        </div>
        <div class="wd-meta" id="wdMeta"></div>
        <div class="wd-forecast" id="wdForecast"></div>
      </div>
    </div>
  </div>

  <!-- ===== Notes Panel（便笺面板） ===== -->
  <div class="notes-panel" id="notesPanel" role="dialog" aria-modal="true" aria-label="便笺">
    <div class="notes-header">
      <div class="notes-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
        便笺
      </div>
      <button class="notes-close" id="closeNotes" aria-label="关闭便笺">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="notes-body">
      <div class="note-input-area">
        <textarea class="note-input" id="noteInput" placeholder="记录灵感、待办事项..." aria-label="便笺内容"></textarea>
        <button class="note-add-btn" id="noteAddBtn" aria-label="添加便笺">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          添加便笺
        </button>
      </div>
      <div class="note-list" id="noteList" aria-live="polite"></div>
    </div>
  </div>

  <!-- ===== Settings Panel（设置面板） ===== -->
  <div class="settings-overlay" id="settingsOverlay" role="dialog" aria-modal="true" aria-label="设置">
    <div class="settings-panel">
      <div class="settings-header">
        <h3>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          个性化设置
        </h3>
        <button class="notes-close" id="closeSettings" aria-label="关闭设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="settings-body">
        <div class="settings-group">
          <div class="settings-group-title">外观</div>
          <div class="settings-row">
            <span class="settings-label" id="lbl-darkMode">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--icon-theme)" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              深色模式
            </span>
            <button class="toggle" id="darkModeToggle" role="switch" aria-checked="false" aria-labelledby="lbl-darkMode"></button>
          </div>
          <div class="settings-row settings-row-slider">
            <span class="settings-label" id="lbl-glass">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 0 20 15.3 15.3 0 0 1 0-20z"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
              玻璃透明度
            </span>
            <div class="slider-wrap">
              <input type="range" id="glassSlider" class="glass-slider" min="0" max="100" value="40" aria-labelledby="lbl-glass">
              <span class="slider-val" id="glassVal" aria-hidden="true">40%</span>
            </div>
          </div>
          <div class="settings-row">
            <span class="settings-label" id="lbl-weather">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--icon-weather-sun)" aria-hidden="true"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/></svg>
              显示天气
            </span>
            <button class="toggle active" id="weatherToggle" role="switch" aria-checked="true" aria-labelledby="lbl-weather"></button>
          </div>
          <div class="settings-row">
            <span class="settings-label" id="lbl-hitokoto">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#f472b6" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              显示一言
            </span>
            <button class="toggle active" id="hitokotoToggle" role="switch" aria-checked="true" aria-labelledby="lbl-hitokoto"></button>
          </div>
        </div>
        <div class="settings-group">
          <div class="settings-group-title">背景</div>
          <div class="settings-row">
            <span class="settings-label" id="lbl-wallpaper">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#34d399" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              每日壁纸
            </span>
            <button class="toggle" id="dailyWallpaperToggle" role="switch" aria-checked="false" aria-labelledby="lbl-wallpaper"></button>
          </div>
        </div>
        <div class="settings-group">
          <div class="settings-group-title">搜索</div>
          <div class="settings-row">
            <span class="settings-label" id="lbl-engine">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#60a5fa" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              默认搜索引擎
            </span>
            <select class="settings-select" id="defaultEngineSelect" aria-labelledby="lbl-engine"></select>
          </div>
        </div>
        <div class="settings-group">
          <div class="settings-group-title">主题色</div>
          <div class="color-options" id="colorOptions" role="radiogroup" aria-label="主题色选择">
            <div class="color-dot active" style="background:#4ade80" data-color="#4ade80" role="radio" aria-checked="true" aria-label="青柠绿" tabindex="0"></div>
            <div class="color-dot" style="background:#3b82f6" data-color="#3b82f6" role="radio" aria-checked="false" aria-label="蓝色" tabindex="0"></div>
            <div class="color-dot" style="background:#06b6d4" data-color="#06b6d4" role="radio" aria-checked="false" aria-label="青色" tabindex="0"></div>
            <div class="color-dot" style="background:#f59e0b" data-color="#f59e0b" role="radio" aria-checked="false" aria-label="橙色" tabindex="0"></div>
            <div class="color-dot" style="background:#ef4444" data-color="#ef4444" role="radio" aria-checked="false" aria-label="红色" tabindex="0"></div>
            <div class="color-dot" style="background:#ec4899" data-color="#ec4899" role="radio" aria-checked="false" aria-label="粉色" tabindex="0"></div>
            <div class="color-dot" style="background:#8b5cf6" data-color="#8b5cf6" role="radio" aria-checked="false" aria-label="紫色" tabindex="0"></div>
            <div class="color-dot" style="background:#ffffff" data-color="#ffffff" role="radio" aria-checked="false" aria-label="白色" tabindex="0"></div>
          </div>
        </div>
        <div class="settings-group">
          <div class="settings-group-title">数据</div>
          <div class="settings-row">
            <span class="settings-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#4ade80" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              导出配置
            </span>
            <button class="data-btn data-btn-primary" id="exportBtn">导出</button>
          </div>
          <div class="settings-row">
            <span class="settings-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#60a5fa" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              导入配置
            </span>
            <button class="data-btn data-btn-secondary" id="importBtn">导入</button>
          </div>
          <div class="settings-row">
            <span class="settings-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#f87171" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
              清空所有数据
            </span>
            <button class="data-btn data-btn-danger" id="clearDataBtn">清空</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Add/Edit Shortcut Modal ===== -->
  <div class="modal-overlay" id="shortcutModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <h3>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span id="modalTitle">添加快捷方式</span>
      </h3>
      <label for="shortcutName">名称</label>
      <input type="text" id="shortcutName" placeholder="例如：GitHub" autocomplete="off">
      <label for="shortcutUrl">网址</label>
      <input type="text" id="shortcutUrl" placeholder="https://github.com" autocomplete="off">
      <label for="shortcutIcon">图标 Slug (Simple Icons 名称，如 github, youtube)</label>
      <input type="text" id="shortcutIcon" placeholder="留空自动识别" autocomplete="off">
      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel" id="modalCancel">取消</button>
        <button class="modal-btn modal-btn-confirm" id="modalConfirm">确定</button>
      </div>
    </div>
  </div>

  <!-- ===== Context Menu（右键菜单） ===== -->
  <div class="context-menu" id="contextMenu">
    <div class="context-item" id="ctxShortcuts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
      <span>快捷导航</span>
    </div>
    <div class="context-item" id="ctxNotes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
      <span>便笺</span>
    </div>
    <div class="context-item" id="ctxSettings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>设置</span>
    </div>
  </div>

  <!-- ===== About Side Panel ===== -->
  <div class="about-panel" id="aboutPanel" role="dialog" aria-modal="true" aria-label="关于本页">
    <div class="about-header">
      <h2>关于本页</h2>
      <button class="about-close" id="aboutCloseBtn" title="关闭" aria-label="关闭关于面板">✕</button>
    </div>
    <div class="about-body">
      <div class="about-logo" aria-hidden="true">🌐</div>
      <h3>My Start Page</h3>
      <p class="about-desc">一个极简、美观、可自定义的浏览器起始页。支持多搜索引擎、快捷导航、便笺、工具箱与本地天气。</p>
      <div class="about-links">
        <a href="https://github.com" target="_blank" rel="noopener">GitHub</a>
        <a href="#" id="aboutResetBtn">重置数据</a>
      </div>
      <div class="about-meta">
        <span>版本 v1.0.0</span>
        <span id="aboutDate"></span>
      </div>
    </div>
  </div>
  <div class="about-backdrop" id="aboutBackdrop"></div>

  <input type="file" id="importFile" accept=".json" style="display:none">

  <!-- ===== Toast 通知 ===== -->
  <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <script src="app.js?v=7"></script>
</body>
</html>
